<tng-card
  class="tng-flow-node"
  tone="neutral"
  variant="solid"
>
  <header class="tng-flow-node__header" [attr.data-has-icon]="icon() ? '' : null">
    @if (icon(); as iconName) {
      <span class="tng-flow-node__icon" aria-hidden="true">
        <tng-icon [icon]="iconName" />
      </span>
    }

    <span class="tng-flow-node__heading">
      <strong class="tng-flow-node__name">{{ name() }}</strong>
      @if (description(); as descriptionText) {
        <span class="tng-flow-node__description">{{ descriptionText }}</span>
      }
    </span>

    <span class="tng-flow-node__state">
      @if (validationIssues().length > 0) {
        <tng-flow-validation-badge
          [issues]="validationIssues()"
          (issueActivated)="activateIssue($event)"
        />
      }
      <span class="tng-flow-node__status" [attr.data-tone]="statusTone()">
        {{ status() }}
      </span>
    </span>
  </header>

  <section class="tng-flow-node__content">
    <ng-content />
  </section>

  @if (resolvedStatusMessage(); as messageText) {
    <p class="tng-flow-node__message">{{ messageText }}</p>
  }

  @if (showProgress()) {
    <footer class="tng-flow-node__footer">
      <tng-progress-bar
        [ariaLabel]="name() + ' progress'"
        [indeterminate]="progress() === null"
        [value]="normalizedProgress()"
      />
    </footer>
  }
</tng-card>
