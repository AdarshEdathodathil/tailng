<span class="tng-flow-port__socket" aria-hidden="true"></span>
@if (label(); as labelText) {
  <span class="tng-flow-port__label">
    {{ labelText }}
    @if (required()) {
      <span class="tng-flow-port__required" aria-hidden="true">*</span>
    }
  </span>
}
@if (validationIssues().length > 0) {
  <tng-flow-validation-badge
    class="tng-flow-port__validation"
    [issues]="validationIssues()"
    (issueActivated)="activateIssue($event)"
  />
}
