<article class="grid gap-4">
  <h2 class="text-xl font-semibold">Confetti</h2>
  <p>Controlled paper bursts remain decorative and never intercept input.</p>
  <div class="flex flex-wrap gap-3">
    <button
      class="rounded-lg bg-blue-600 px-4 py-2 text-white"
      type="button"
      (click)="launch('bottom')"
    >
      Fullscreen bottom
    </button>
    <button
      class="rounded-lg bg-violet-600 px-4 py-2 text-white"
      type="button"
      (click)="launch('center', true, false, ['#06b6d4', '#8b5cf6', '#f43f5e'])"
    >
      Center + palette
    </button>
    <button
      class="rounded-lg bg-emerald-600 px-4 py-2 text-white"
      type="button"
      (click)="launch('bottom', false)"
    >
      Contained burst
    </button>
    <button
      class="rounded-lg bg-slate-700 px-4 py-2 text-white"
      type="button"
      (click)="launch('bottom', true, true)"
    >
      Reduced-motion completion
    </button>
  </div>
  <section
    class="relative flex min-h-64 items-center justify-between overflow-hidden rounded-2xl border border-slate-300 bg-slate-100 p-4 dark:border-slate-700 dark:bg-slate-900"
  >
    <strong>Container target</strong><span>Completions: {{ completions() }}</span>
    <tng-confetti
      [active]="active()"
      [origin]="origin()"
      [fullscreen]="fullscreen()"
      [reducedMotion]="reducedMotion()"
      [colors]="colors()"
      [pieces]="140"
      (completed)="onCompleted()"
    />
  </section>
</article>
